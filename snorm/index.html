<!DOCTYPE html>
<html lang="en-GB" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Why do we standardise?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ec; --surface:#ffffff; --fg:#1b1e2a; --muted:#5b6070; --line:#cfccc3;
  --blue:#1d6fd6; --orange:#c9630c; --gold:#8f6700; --teal:#12877b; --pink:#c03c7c; --green:#2f8a3a;
  --on-gold:#ffffff;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161f; --surface:#1d2030; --fg:#e6e6e6; --muted:#9aa0b4; --line:#363b52;
    --blue:#4ea1ff; --orange:#ff9f43; --gold:#ffd166; --teal:#4fd1c5; --pink:#f687b3; --green:#9ae6b4;
    --on-gold:#14161f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14161f; --surface:#1d2030; --fg:#e6e6e6; --muted:#9aa0b4; --line:#363b52;
  --blue:#4ea1ff; --orange:#ff9f43; --gold:#ffd166; --teal:#4fd1c5; --pink:#f687b3; --green:#9ae6b4;
  --on-gold:#14161f; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);color:var(--fg);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
}
.top{display:flex;align-items:center;gap:12px;padding:10px 14px 2px;min-height:50px}
.heading{flex:1;min-width:0;font-weight:600;font-size:clamp(15px,2.1vw,22px);line-height:1.25;transition:opacity .18s}
.heading .expr{font-family:"STIX Two Text","Cambria Math","Times New Roman",serif;font-weight:400;font-size:1.1em;margin-left:.6em;color:var(--gold);white-space:nowrap}
.tools{display:flex;gap:6px;flex:none}
.icon{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0}
.icon svg{width:18px;height:18px}
.stage{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.caption{min-height:2.7em;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px 18px;font-size:clamp(15px,2.2vw,24px);line-height:1.3;transition:opacity .18s}
.controls{display:flex;align-items:center;gap:10px;padding:6px 12px 10px}
.btn{height:44px;min-width:88px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 15px Inter,system-ui,sans-serif;cursor:pointer}
.btn.primary{background:var(--gold);color:var(--on-gold);border-color:transparent}
.btn:disabled{opacity:.35;cursor:default}
.progress{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px}
.scene{font-size:12px;color:var(--muted)}
.dots{display:flex;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer;transition:transform .2s,background .2s}
.dot.done{background:var(--gold);opacity:.5}
.dot.cur{background:var(--gold);transform:scale(1.35)}
.fade{opacity:0}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-height:480px){
  .top{padding:4px 12px 0;min-height:42px}
  .caption{min-height:1.9em;font-size:15px}
  .controls{padding:2px 12px 6px}
  .btn{height:38px}
}
</style>
</head>
<body>
<header class="top">
  <div id="heading" class="heading"></div>
  <div class="tools">
    <button class="icon" id="replay" aria-label="Replay this step (R)" title="Replay (R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
    <button class="icon" id="theme" aria-label="Switch light or dark" title="Light or dark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
    </button>
    <button class="icon" id="fs" aria-label="Fullscreen (F)" title="Fullscreen (F)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</header>
<main class="stage" id="stage"><canvas id="cv" aria-label="Animation of normal distribution curves"></canvas></main>
<div id="caption" class="caption" aria-live="polite"></div>
<nav class="controls">
  <button class="btn" id="back">Back</button>
  <div class="progress"><span class="scene" id="scene"></span><span class="dots" id="dots"></span></div>
  <button class="btn primary" id="next">Next</button>
</nav>

<script>
(() => {
'use strict';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const headEl = document.getElementById('heading'), capEl = document.getElementById('caption');
const sceneEl = document.getElementById('scene'), dotsEl = document.getElementById('dots');
const backBtn = document.getElementById('back'), nextBtn = document.getElementById('next');
const UI = "Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
const MATH = "'STIX Two Text', 'Cambria Math', 'Times New Roman', serif";

let W = 300, H = 300, DPR = 1, G = { s: 1 };
const C = {};
const TOK = ['bg','surface','fg','muted','line','blue','orange','gold','teal','pink','green'];
function readColors(){ const cs = getComputedStyle(document.documentElement); TOK.forEach(k => C[k] = cs.getPropertyValue('--' + k).trim()); }

function hexRGB(h){ let x = h.replace('#',''); if (x.length === 3) x = x.split('').map(c => c + c).join(''); const n = parseInt(x, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgba(h, a){ const [r,g,b] = hexRGB(h); return `rgba(${r},${g},${b},${Math.max(0, Math.min(1, a))})`; }
function mixHex(a, b, t){ const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v,i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2,'0')).join(''); }
const lerp = (a, b, t) => a + (b - a) * t;
const clamp01 = x => Math.max(0, Math.min(1, x));
const ease = u => u < 0.5 ? 4*u*u*u : 1 - Math.pow(-2*u + 2, 3) / 2;

/* ---------- Layout ---------- */
function layout(){
  const s = Math.max(0.78, Math.min(1.5, Math.min(W, H * 1.35) / 560));
  const L = Math.max(18 * s, W * 0.06), R = W - L;
  const axisY = Math.max(H * 0.64, Math.min(H * 0.76, H - 140 * s)), topY = H * 0.13, plotH = axisY - topY;
  const base = axisY + 46 * s;
  const gap = Math.min(24 * s, (H - 8 * s - base) / 3.2);
  G = { s, L, R, axisY, topY, plotH, unitH: plotH * 0.94 / 2.5, base, gap };
}
const px = p => G.L + (p + 1) / 2 * (G.R - G.L);
const yv = h => G.axisY - h * G.unitH;
const row = n => G.base + G.gap * (n - 0.4);
function pdf(p, c, w){ const z = (p - c) / w; return Math.exp(-0.5 * z * z) / (w * 2.5066283); }

function resize(){
  const r = cv.parentElement.getBoundingClientRect();
  W = Math.max(200, r.width); H = Math.max(200, r.height);
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  layout();
}

/* ---------- Drawing helpers ---------- */
function setFont(size, weight = 400, family = UI, italic = false){ ctx.font = `${italic ? 'italic ' : ''}${weight} ${size * G.s}px ${family}`; }
function text(str, x, y, o = {}){
  const { size = 16, weight = 400, color = C.fg, alpha = 1, align = 'center', base = 'alphabetic', family = UI, italic = false } = o;
  if (alpha <= 0.01) return 0;
  setFont(size, weight, family, italic);
  ctx.textAlign = align; ctx.textBaseline = base; ctx.fillStyle = rgba(color, alpha);
  ctx.fillText(str, x, y);
  return ctx.measureText(str).width;
}
function measure(str, size, weight = 400, family = UI, italic = false){ setFont(size, weight, family, italic); return ctx.measureText(str).width; }
function fitSize(str, size, weight, maxW, family = UI){ const w = measure(str, size, weight, family); return w > maxW ? size * maxW / w : size; }
function wrap(str, maxW, size, weight){
  const words = str.split(' '), lines = []; let cur = '';
  words.forEach(wd => { const t = cur ? cur + ' ' + wd : wd; if (measure(t, size, weight) > maxW && cur){ lines.push(cur); cur = wd; } else cur = t; });
  if (cur) lines.push(cur); return lines;
}
function rr(x, y, w, h, r){ r = Math.min(r, w/2, h/2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function line(x1, y1, x2, y2, col, a, lw){ if (a <= 0.01) return; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = rgba(col, a); ctx.lineWidth = lw; ctx.stroke(); }

function strokeCurve(c, w, col, a, draw = 1, mx = px, my = yv){
  if (a <= 0.004 || draw <= 0.001) return;
  const n = 240, from = -1.04, to = from + 2.08 * draw, pts = [];
  for (let i = 0; i <= n; i++){ const p = from + (to - from) * i / n; pts.push([mx(p), my(pdf(p, c, w))]); }
  ctx.beginPath(); ctx.moveTo(pts[0][0], my(0)); pts.forEach(q => ctx.lineTo(q[0], q[1])); ctx.lineTo(pts[n][0], my(0)); ctx.closePath();
  ctx.fillStyle = rgba(col, 0.09 * a); ctx.fill();
  ctx.beginPath(); pts.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]));
  ctx.strokeStyle = rgba(col, a); ctx.lineWidth = 2.6 * G.s; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
}
function shade(c, w, z1, z2, col, a){
  if (a <= 0.004) return;
  const p1 = Math.max(-1.04, c + z1 * w), p2 = Math.min(1.04, c + z2 * w);
  if (p2 <= p1) return;
  const n = 120; ctx.beginPath(); ctx.moveTo(px(p1), G.axisY);
  for (let i = 0; i <= n; i++){ const p = p1 + (p2 - p1) * i / n; ctx.lineTo(px(p), yv(pdf(p, c, w))); }
  ctx.lineTo(px(p2), G.axisY); ctx.closePath(); ctx.fillStyle = rgba(col, a); ctx.fill();
}

/* ---------- Axes ---------- */
const fmtSigned = v => v > 0 ? '+' + v : v < 0 ? '\u2212' + (-v) : '0';
const range = (a, b, st) => { const r = []; for (let v = a; v <= b + 1e-9; v += st) r.push(v); return r; };
const AX = {
  marks: { p: v => (v - 60) / 50, vals: range(10, 110, 10), fmt: v => '' + v, title: 'Marks' },
  above: { p: v => v / 48, vals: range(-48, 48, 12), fmt: fmtSigned, title: 'Marks above average' },
  z:     { p: v => v / 4, vals: range(-4, 4, 1), fmt: v => v < 0 ? '\u2212' + (-v) : '' + v, title: 'Standard deviations from the mean (z)' },
  test:  { p: v => (v - 70) / 40, vals: [35, 50, 65, 80, 95, 110], fmt: v => '' + v, title: 'Test marks' }
};
function drawTicks(ax, a){
  const s = G.s, sp = (G.R - G.L) * Math.abs(ax.p(ax.vals[1]) - ax.p(ax.vals[0])) / 2;
  const skip = sp < 26 * s ? 2 : 1;
  ax.vals.forEach((v, i) => {
    const x = px(ax.p(v)); if (x < G.L - 14 * s || x > G.R + 14 * s) return;
    line(x, G.axisY, x, G.axisY + 5 * s, C.fg, 0.6 * a, 1.2 * s);
    if (i % skip === 0) text(ax.fmt(v), x, G.axisY + 19 * s, { size: 12.5, color: C.muted, alpha: a });
  });
  text(ax.title, (G.L + G.R) / 2, G.axisY + 37 * s, { size: 12.5, color: C.muted, alpha: a });
}

/* ---------- Pieces ---------- */
function bracket(c, w, y, col, a, label){
  if (a <= 0.01) return; const s = G.s, x1 = px(c), x2 = px(c + w);
  ctx.beginPath(); ctx.moveTo(x1, y - 6 * s); ctx.lineTo(x1, y); ctx.lineTo(x2, y); ctx.lineTo(x2, y - 6 * s);
  ctx.strokeStyle = rgba(col, a); ctx.lineWidth = 2 * s; ctx.stroke();
  const tw = measure(label, 12.5, 600);
  if (x2 + 8 * s + tw < W - 4) text(label, x2 + 8 * s, y + 4 * s, { size: 12.5, weight: 600, color: col, alpha: a, align: 'left' });
  else text(label, x1 - 8 * s, y + 4 * s, { size: 12.5, weight: 600, color: col, alpha: a, align: 'right' });
}
function ruler(c, w, z, prog, y, col, a, unitLabel, zLab){
  if (a <= 0.01) return; const s = G.s, h = 8 * s, x0 = px(c), xu = px(c + w);
  ctx.strokeStyle = rgba(col, 0.65 * a); ctx.lineWidth = 1.2 * s; ctx.strokeRect(x0, y - h/2, xu - x0, h);
  const len = prog * z;
  if (len > 0.001){
    for (let k = 0; k < len; k++){
      const e = Math.min(k + 1, len); ctx.fillStyle = rgba(col, (k % 2 ? 0.45 : 0.9) * a);
      ctx.fillRect(px(c + k * w), y - h/2, px(c + e * w) - px(c + k * w), h);
    }
    const xe = px(c + len * w); line(xe, y - h, xe, y + h, col, a, 2 * s);
    const v = Math.round(len * 100) / 100;
    text(`${v} SD${v === 1 ? '' : 's'}`, Math.max(xe, xu) + 7 * s, y + 4.5 * s, { size: 12.5, weight: 600, color: col, alpha: a, align: 'left' });
  } else { ctx.fillStyle = rgba(col, 0.35 * a); ctx.fillRect(x0, y - h/2, xu - x0, h); }
  text(unitLabel, x0 - 8 * s, y + 4.5 * s, { size: 12.5, weight: 600, color: col, alpha: a * (1 - zLab), align: 'right' });
  text('1 SD', x0 - 8 * s, y + 4.5 * s, { size: 12.5, weight: 600, color: col, alpha: a * zLab, align: 'right' });
}
function dot(c, w, z, col, a, drop, name, side){
  if (a <= 0.01) return; const s = G.s, p = c + z * w, x = px(p);
  const y = yv(pdf(p, c, w)) - (1 - drop) * 46 * s;
  ctx.save(); ctx.setLineDash([4 * s, 4 * s]); line(x, y, x, G.axisY, col, 0.7 * a * drop, 1.5 * s); ctx.restore();
  ctx.beginPath(); ctx.arc(x, y, 6.5 * s, 0, Math.PI * 2); ctx.fillStyle = rgba(col, a); ctx.fill();
  ctx.lineWidth = 2.2 * s; ctx.strokeStyle = rgba(C.bg, a); ctx.stroke();
  if (side === 'r') text(name, x + 11 * s, y + 22 * s, { size: 13.5, weight: 600, color: col, alpha: a, align: 'left' });
  else text(name, x - 11 * s, y - 9 * s, { size: 13.5, weight: 600, color: col, alpha: a, align: 'right' });
}
function drawHouse(a, w){
  if (a <= 0.01) return; const s = G.s, wf = w / 0.24, hf = 0.24 / w;
  const bw = 62 * s * wf, bh = 46 * s * hf, roof = 22 * s * hf;
  const cx = G.R - 52 * s, by = G.topY + 0.56 * G.plotH, x = cx - bw / 2, y = by - bh;
  ctx.lineWidth = 2 * s; ctx.strokeStyle = rgba(C.fg, 0.9 * a); ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.rect(x, y, bw, bh); ctx.moveTo(x - 4 * s, y); ctx.lineTo(cx, y - roof); ctx.lineTo(x + bw + 4 * s, y); ctx.stroke();
  ctx.fillStyle = rgba(C.gold, 0.55 * a);
  [[0.12, 0.14], [0.68, 0.14], [0.12, 0.5], [0.68, 0.5]].forEach(([fx, fy]) => { ctx.fillRect(x + fx * bw, y + fy * bh, 0.2 * bw, 0.22 * bh); });
  ctx.fillStyle = rgba(C.muted, 0.8 * a); ctx.fillRect(x + 0.4 * bw, y + 0.58 * bh, 0.2 * bw, 0.42 * bh);
}
function drawZFormula(cx, cy, size, alpha, boxed){
  if (alpha <= 0.01) return; const s = G.s;
  const lhs = 'Z = ', num = 'X \u2212 \u03bc', den = '\u03c3';
  const wl = measure(lhs, size, 400, MATH, true), wn = measure(num, size, 400, MATH, true), wd = measure(den, size, 400, MATH, true);
  const fw = Math.max(wn, wd) + 0.4 * size * s, tot = wl + fw, x0 = cx - tot / 2, fx = x0 + wl;
  text(lhs, x0, cy + 0.33 * size * s, { size, family: MATH, italic: true, align: 'left', alpha });
  line(fx, cy, fx + fw, cy, C.fg, alpha, Math.max(1, 0.06 * size * s));
  text(num, fx + fw / 2, cy - 0.22 * size * s, { size, family: MATH, italic: true, alpha });
  text(den, fx + fw / 2, cy + 0.92 * size * s, { size, family: MATH, italic: true, alpha });
  if (boxed){ const pad = 0.5 * size * s; rr(x0 - pad, cy - 1.25 * size * s, tot + 2 * pad, 2.5 * size * s, 8 * s); ctx.strokeStyle = rgba(C.gold, alpha); ctx.lineWidth = 1.6 * s; ctx.stroke(); }
}

const STUDENTS = [
  { name: 'Aisha', sub: 'Maths test', score: 68, avg: 56, col: 'blue', z: '68 \u2192 z = 1.5' },
  { name: 'Ben', sub: 'English test', score: 74, avg: 62, col: 'orange', z: '74 \u2192 z = 0.75' }
];
function cardGeom(){ const s = G.s; return { cw: Math.min(W * 0.42, 250 * s), ch: 176 * s, gap: Math.min(W * 0.06, 40 * s) }; }
function drawCards(S, t){
  const s = G.s, { cw, ch, gap } = cardGeom();
  if (S.cardsO > 0.01){
    const k = lerp(1, 0.6, S.cardsPos), y = lerp(H * 0.05, 8 * s, S.cardsPos);
    const xs = [[W/2 - gap/2 - cw, 8 * s], [W/2 + gap/2, W - 8 * s - cw * 0.6]];
    STUDENTS.forEach((d, i) => {
      const col = C[d.col], x = lerp(xs[i][0], xs[i][1], S.cardsPos);
      ctx.save(); ctx.translate(x, y); ctx.scale(k, k); ctx.globalAlpha = S.cardsO;
      rr(0, 0, cw, ch, 12 * s); ctx.fillStyle = C.surface; ctx.fill(); ctx.strokeStyle = rgba(col, 0.55); ctx.lineWidth = 1.5 * s; ctx.stroke();
      ctx.fillStyle = col; ctx.fillRect(0, 14 * s, 4 * s, ch - 28 * s);
      const tx = 18 * s;
      text(d.name, tx, 32 * s, { size: 20, weight: 600, align: 'left' });
      text(d.sub, tx, 52 * s, { size: 13.5, color: C.muted, align: 'left' });
      text(String(d.score), tx, 100 * s, { size: 42, weight: 700, color: col, align: 'left' });
      text(`Class average: ${d.avg}`, tx, 128 * s, { size: 13.5, color: C.muted, align: 'left', alpha: S.avgO });
      if (S.plus12 > 0) text(`+${Math.round(12 * S.plus12)} above average`, tx, 154 * s, { size: 14.5, weight: 600, color: col, align: 'left', alpha: Math.min(1, S.plus12 * 5) });
      ctx.restore();
    });
    if (S.barsO > 0.01){
      const a = S.barsO * S.cardsO, yb = H * 0.9, top = H * 0.05 + ch + 40 * s, maxH = Math.max(30, yb - top);
      STUDENTS.forEach((d, i) => {
        const col = C[d.col], cx = xs[i][0] + cw / 2, bw = cw * 0.36, h = maxH * (d.score / 80) * S.barsGrow;
        ctx.fillStyle = rgba(col, 0.85 * a); ctx.fillRect(cx - bw / 2, yb - h, bw, h);
        text(String(Math.round(d.score * S.barsGrow)), cx, yb - h - 8 * s, { size: 17, weight: 700, color: col, alpha: a });
        if (i === 1 && S.qO > 0.01){ const pulse = 1 + 0.08 * Math.sin(t * 4); text('?', cx, yb - h - 34 * s, { size: 34 * pulse, weight: 700, color: C.gold, alpha: S.qO * a }); }
      });
      line(xs[0][0], yb, xs[1][0] + cw, yb, C.fg, 0.5 * a, 1.2 * s);
    }
  }
  if (S.zCardsO > 0.01){
    STUDENTS.forEach((d, i) => {
      const col = C[d.col], cwz = Math.max(measure(d.z, 14.5, 600), measure(d.name, 14, 600)) + 26 * s, chz = 56 * s;
      const x = i ? W - 8 * s - cwz : 8 * s;
      ctx.save(); ctx.globalAlpha = S.zCardsO; ctx.translate(x, 8 * s);
      rr(0, 0, cwz, chz, 10 * s); ctx.fillStyle = C.surface; ctx.fill(); ctx.strokeStyle = rgba(col, 0.55); ctx.lineWidth = 1.5 * s; ctx.stroke();
      text(d.name, 13 * s, 22 * s, { size: 14, weight: 600, align: 'left' });
      text(d.z, 13 * s, 43 * s, { size: 14.5, weight: 600, color: col, align: 'left' });
      ctx.restore();
    });
  }
}

const SM = [
  { name: 'Heights', dist: 'N(170, 10\u00b2)', c: -0.15, w: 0.3, col: 'teal', o: 'sm1O', m: 'm1' },

/* ---------- Playback ---------- */
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
let cur = 0, t0 = performance.now();
function stateAt(now){
  const b = BEATS[cur], from = cur ? STATES[cur - 1] : DEF, to = STATES[cur], win = WINS[cur];
  const T = reduce.matches ? 1 : clamp01((now - t0) / (b.dur * 1000));
  const S = {};
  for (const k in to){
    if (from[k] === to[k]) { S[k] = to[k]; continue; }
    const [a, z] = win[k] || [0, 1];
    S[k] = lerp(from[k], to[k], ease(clamp01((T - a) / Math.max(1e-6, z - a))));
  }
  return S;
}
function go(i){ cur = Math.max(0, Math.min(BEATS.length - 1, i)); t0 = performance.now(); updateUI(); }
const next = () => go(cur === BEATS.length - 1 ? 0 : cur + 1);
const back = () => { if (cur > 0) go(cur - 1); };
const replay = () => go(cur);

function setFade(el, html){
  if (el.dataset.v === html) return; el.dataset.v = html;
  el.classList.add('fade'); clearTimeout(el._t);
  el._t = setTimeout(() => { el.innerHTML = html; el.classList.remove('fade'); }, 180);
}
function updateUI(){
  const b = BEATS[cur];
  setFade(headEl, b.heading); setFade(capEl, b.caption);
  sceneEl.textContent = `Scene ${b.scene} of ${SCENES}`;
  dotsEl.innerHTML = '';
  let n = 0;
  BEATS.forEach((x, i) => {
    if (x.scene !== b.scene) return; n++;
    const d = document.createElement('button');
    d.className = 'dot' + (i < cur ? ' done' : '') + (i === cur ? ' cur' : '');
    d.setAttribute('aria-label', `Scene ${x.scene}, step ${n}`);
    d.addEventListener('click', () => go(i));
    dotsEl.appendChild(d);
  });
  backBtn.disabled = cur === 0;
  nextBtn.textContent = cur === BEATS.length - 1 ? 'Restart' : 'Next';
}

function draw(S, t){
  const s = G.s;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);

  // gold standard curve and its shading

    shade(S.gc, S.gw, -4.3, -4.3 + 5.05 * S.gBenShade, C.orange, 0.45 * S.gO * Math.min(1, S.gBenShade * 8));
    shade(S.gc, S.gw, 0.75, 0.75 + 0.75 * S.gAishaShade, C.blue, 0.55 * S.gO * Math.min(1, S.gAishaShade * 8));
    shade(S.gc, S.gw, 1.2816, 9, C.gold, 0.42 * S.gO * S.tailO);
    strokeCurve(S.gc, S.gw, C.gold, S.gO, S.gDraw);
  }
  drawSmall(S);

  // Maths and English curves
  const bcol = mixHex(C.blue, C.orange, S.bMix);
  if (S.bO > 0.004){
    shade(S.bc, S.bw, -2, 2, bcol, 0.14 * S.band2 * S.bO);
    shade(S.bc, S.bw, -1, 1, bcol, 0.30 * S.band1 * S.bO);
  }
  strokeCurve(S.oc, S.ow, C.orange, S.oO, S.oDraw);
  strokeCurve(S.bc, S.bw, bcol, S.bO, S.bDraw);
  if (S.band1 > 0.01 && S.bO > 0.01){
    const pk = pdf(S.bc, S.bc, S.bw);
    text('68%', px(S.bc), yv(pk * 0.4), { size: 17, weight: 700, alpha: S.band1 * S.bO });
  }
  if (S.band2 > 0.01 && S.bO > 0.01){
    const a = S.band2 * S.bO, p0 = S.bc + 1.55 * S.bw, lx = px(S.bc + 2.25 * S.bw), ly = yv(pdf(S.bc + 1.5 * S.bw, S.bc, S.bw)) - 4 * s;
    line(px(p0), yv(pdf(p0, S.bc, S.bw) * 0.45), lx - 4 * s, ly - 5 * s, C.fg, 0.6 * a, 1.2 * s);
    text('95%', lx, ly, { size: 15, weight: 700, alpha: a, align: 'left' });
  }

  // axis
  if (S.axisO > 0.01){
    const x0 = G.L - 10 * s, x1 = G.R + 10 * s;

    [['marks', S.axMarksO], ['above', S.axAboveO], ['z', S.axZO], ['test', S.axTestO]].forEach(([k, a]) => { if (a * S.axisO > 0.01) drawTicks(AX[k], a * S.axisO); });
  }

  drawHouse(S.houseO, S.bw);

  bracket(S.bc, S.bw, row(1), C.blue, S.bBrO, '1 SD = 8 marks');
  bracket(S.oc, S.ow, row(2), C.orange, S.oBrO, '1 SD = 16 marks');
  ruler(S.bc, S.bw, 1.5, S.rulerProg, row(1), C.blue, S.rulerO, '1 SD = 8 marks', S.axZO);
  ruler(S.oc, S.ow, 0.75, S.rulerProg, row(2), C.orange, S.rulerO, '1 SD = 16 marks', S.axZO);
  if (S.goldRulerO > 0.01){
    const y = row(3), h = 8 * s; ctx.fillStyle = rgba(C.gold, 0.9 * S.goldRulerO);
    ctx.fillRect(px(0), y - h/2, px(0.25) - px(0), h);
    text('Target: 1 SD', px(0) - 8 * s, y + 4.5 * s, { size: 12.5, weight: 600, color: C.gold, alpha: S.goldRulerO, align: 'right' });
  }

  dot(S.bc, S.bw, 1.5, C.blue, S.aO, S.aDrop, 'Aisha', 'r');
  dot(S.oc, S.ow, 0.75, C.orange, S.benO, S.benDrop, 'Ben', 'l');

  text('Total area = 1', G.L, G.axisY - 0.14 * G.plotH, { size: 13.5, weight: 500, color: C.muted, alpha: S.areaO, align: 'left' });

  if (S.formulaO > 0.01 || S.workO > 0.01){
    const size = 22, cy = Math.max(G.topY * 0.55, 1.3 * size * s + 6 * s);

    text('Ben: (74 \u2212 62) / 16 = 0.75', W / 2, y1 + 22 * s, { size: 15, weight: 500, color: C.orange, alpha: S.workO });

    text('z = 1.2816', lx, ly + 18 * s, { size: 15, family: MATH, italic: true, color: C.gold, align: 'left', alpha: S.markerO * S.markerZO });
    text('80 marks', lx, ly + 18 * s, { size: 14, weight: 600, color: C.gold, align: 'left', alpha: S.markerO * S.markerXO });
  }
  if (S.probO > 0.01 || S.eqO > 0.01 || S.ansO > 0.01){
    const pad = 10 * s, size = 15, prob = '10% of students scored over 80. The mean was 65. Find the standard deviation.';
    const lines = wrap(prob, G.R - G.L - 2 * pad, size, 500), lh = size * s * 1.35, ch = pad * 2 + lines.length * lh;

  else if (k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); back(); }
  else if (k === 'r' || k === 'R') replay();
  else if (k === 'f' || k === 'F') toggleFS();
  else if (/^[1-9]$/.test(k)){ const i = BEATS.findIndex(b => b.scene === +k); if (i >= 0) go(i); }
});

let pd = null;
cv.addEventListener('pointerdown', e => { pd = { x: e.clientX, y: e.clientY }; });
cv.addEventListener('pointerup', e => {
  if (!pd) return; const dx = e.clientX - pd.x, dy = e.clientY - pd.y; pd = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){ dx < 0 ? next() : back(); return; }
  if (Math.abs(dx) < 12 && Math.abs(dy) < 12){ const r = cv.getBoundingClientRect(); (e.clientX - r.left) < r.width / 2 ? back() : next(); }
});
cv.addEventListener('pointercancel', () => { pd = null; });

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);
new ResizeObserver(resize).observe(document.getElementById('stage'));

readColors(); resize(); updateUI();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
